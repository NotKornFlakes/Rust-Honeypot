#!/usr/sbin/nft -f
# The firewall on the server itself. It's the only thing covering the metadata server, because
# Google Cloud's firewall rules don't apply to that traffic. Create the honeypot user before
# loading this.

flush ruleset

define METADATA = 169.254.169.254
define IAP_RANGE = 35.235.240.0/20

table inet honeypot {
    # The program can't bind port 23 without root, so the port is forwarded to it instead.
    chain prerouting {
        type nat hook prerouting priority dstnat; policy accept;
        tcp dport 23 redirect to :2323
    }

    chain input {
        type filter hook input priority filter; policy drop;
        iif lo accept
        ct state established,related accept
        tcp dport 22 ip saddr $IAP_RANGE accept
        tcp dport 2323 ct status dnat accept
        ip saddr $METADATA udp sport 67 udp dport 68 accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy drop;
        oif lo accept
        ct state established,related accept

        # The honeypot gets no exceptions: it only ever replies to visitors.
        meta skuid "honeypot" counter log prefix "egress-blocked-honeypot: " drop

        # The server needs these to keep its IP address and the right time. DNS stays blocked,
        # because data can be smuggled out inside DNS lookups.
        ip daddr $METADATA udp sport 68 udp dport 67 accept
        ip daddr $METADATA udp dport 123 accept
        ip daddr $METADATA tcp dport 80 meta skuid 0 accept

        # Google's guest agent keeps looking up its own services. These are dropped like any
        # other DNS, just without a log line, so they can't use up the log limit below.
        ip daddr $METADATA udp dport 53 counter drop
        ip daddr $METADATA tcp dport 53 counter drop

        ct state new limit rate 10/minute counter log prefix "egress-blocked: "
    }
}

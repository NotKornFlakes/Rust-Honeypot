# Turns on the fake shell from Stage 7. This goes in
# /etc/systemd/system/honeypot.service.d/shell.conf. Delete it and restart to turn the shell off,
# which leaves the fake login running as it was before.
[Service]
ExecStart=
ExecStart=/opt/honeypot/honeypot --listen 0.0.0.0:2323 --checklist-done --credentials /opt/honeypot/credentials.txt

# A second wall behind "nothing is ever run". The program never starts anything, and even if a
# bug tried to, the only place on the whole system it could run a program from is its own folder.
NoExecPaths=/
ExecPaths=/opt/honeypot
